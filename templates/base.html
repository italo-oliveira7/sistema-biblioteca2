<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Biblioteca Escolar{% endblock %}</title>
  <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="header">
  <div class="header-content">
    <div class="header-logo">
      <svg width="28" height="28" fill="white" viewBox="0 0 24 24">
        <path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/>
      </svg>
      <h1>Biblioteca Escolar</h1>
    </div>
    <nav class="nav">
      <a href="{{ url_for('index') }}"
         class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
        Início
      </a>
      <a href="{{ url_for('livros') }}"
         class="nav-link {% if request.endpoint in ['livros','livros_novo','livros_editar','livros_deletar'] %}active{% endif %}">
        Livros
      </a>
      <a href="{{ url_for('alunos') }}"
         class="nav-link {% if request.endpoint in ['alunos','alunos_novo','alunos_editar','alunos_deletar'] %}active{% endif %}">
        Alunos
      </a>
      <a href="{{ url_for('emprestimos') }}"
         class="nav-link {% if request.endpoint in ['emprestimos','emprestimos_novo','emprestimos_devolver'] %}active{% endif %}">
        Empréstimos
      </a>
    </nav>
  </div>
</header>

<main class="main">
  {% with msgs = get_flashed_messages(with_categories=True) %}
    {% for categoria, mensagem in msgs %}
      <div class="flash {{ categoria }}">{{ mensagem }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<footer class="footer">
  © 2026 Biblioteca Escolar · Python + Flask + SQLite
</footer>

<script>
  // Fecha modal ao clicar fora
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('active');
    });
  });
</script>

</body>
</html>
